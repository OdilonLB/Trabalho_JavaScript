<script>

const nota1 = 7.0;
const nota2 = 6.5;
const nota3 = 5.0;

const media = (nota1 + nota2 + nota3) / 3;

const aprovado = media >= 6.0;
const recuperacao = media >= 4.0 && media < 6.0;
const reprovado = media < 4.0;

console.log(`Média do aluno: ${media.toFixed(2)}`);
console.log(`- Aprovado (Média ≥ 6): ${aprovado}`);
console.log(`- Em Recuperação (4 ≤ Média < 6): ${recuperacao}`);
console.log(`- Reprovado (Média < 4): ${reprovado}`);

</script>
