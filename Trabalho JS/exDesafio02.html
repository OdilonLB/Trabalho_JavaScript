<script>

const valorCarrinho = 550.00;
const desconto = 15;

const valorFinal = valorCarrinho * (1 - desconto / 100);

console.log(`Valor inicial do carrinho: R$ ${valorCarrinho.toFixed(2)}`);
console.log(`Desconto aplicado: ${desconto}%`);
console.log(`Valor final da compra: R$ ${valorFinal.toFixed(2)}`);

</script>
